<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Register Now</h1>

    {% if messages %}
        {% for message in messages %}
            <h2 style="color:yellow; background-color: black; padding: 10px;">{{message}}</h2>
        {% endfor %}
        <hr> <br>
    {% endif %}

    <form action="" method="post">
        {% csrf_token %}

        <div>
            <label for="fname">Enter Your First Name : </label>
            <input type="text" placeholder="first name" name="fname" id="fname" required>
        </div> <br>
        <div>
            <label for="lname">Enter Your Last Name : </label>
            <input type="text" placeholder="Last name" name="lname" id="lname" required>
        </div> <br>
        <div>
            <label for="gender">Select Gender : </label>
            <select name="gender" id="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
        </select>
        </div>

        <br>
        <div>
            <label for="utype">Select Role : </label>
            <select name="utype" id="utype">
            <option value="recruiter">Recruiter</option>
            <option value="jobseeker">JobSeeker</option>
            
        </select>
        </div>
        <br>
        <div>
            <label for="email">Enter Your Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <br>
        <div>
            <label for="cno">Enter Your Contact No .</label>
            <input type="text" id="cno" name="cno" required>
        </div> 
        <br>       
        <div>
            <label for="pwd">Enter Your Password</label>
            <input type="password" id="pwd" name="pwd" required>
        </div>
         <br>
         <button type="submit">Register</button>
    </form>
</body>
</html>
